version: '3.8'

services:

  mongo-course:
    image: mongo:8
    container_name: mongo-course
    ports:
      - "27017:27017"

  mongo-enrollment:
    image: mongo:8
    container_name: mongo-enrollment
    ports:
      - "27018:27017"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"