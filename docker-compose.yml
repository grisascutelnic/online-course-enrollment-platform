services:
  mongo-course:
    image: mongo:8
    container_name: mongo-course
    ports:
      - "27017:27017"
    volumes:
      - mongo-course-data:/data/db

  mongo-enrollment:
    image: mongo:8
    container_name: mongo-enrollment
    ports:
      - "27018:27017"
    volumes:
      - mongo-enrollment-data:/data/db

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  config-server:
    build:
      context: ./config-server
    image: config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_PATH: file:/app/config-repo
    volumes:
      - ./config-repo:/app/config-repo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  eureka-server:
    build:
      context: ./eureka-server
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  course-service:
    build:
      context: ./course-service
    image: course-service:latest
    container_name: course-service
    restart: on-failure
    ports:
      - "8081:8081"
    env_file:
      - ./course-service/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      MONGO_URI: mongodb://mongo-course:27017/course_db
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - config-server
      - eureka-server
      - mongo-course
      - rabbitmq

  enrollment-service:
    build:
      context: ./enrollment-service
    image: enrollment-service:latest
    container_name: enrollment-service
    restart: on-failure
    ports:
      - "8082:8082"
    env_file:
      - ./enrollment-service/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      MONGO_URI: mongodb://mongo-enrollment:27017/enrollment_db
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - config-server
      - eureka-server
      - mongo-enrollment
      - rabbitmq

  gateway:
    build:
      context: ./gateway
    image: gateway:latest
    container_name: gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      course-service:
        condition: service_started
      enrollment-service:
        condition: service_started
volumes:
  mongo-course-data:
  mongo-enrollment-data:
