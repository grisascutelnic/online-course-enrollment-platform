spring.config.import=optional:file:.env[.properties],optional:file:course-service/.env[.properties]

spring.application.name=course-service
server.port=8081

services.enrollment-service.url=http://localhost:8082

spring.data.mongodb.uri=mongodb://localhost:27017/course_db

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest