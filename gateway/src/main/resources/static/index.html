<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Course Assistant</title>
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
    <main id="loginView" class="login-shell" aria-label="AI Course Assistant login">
        <section class="login-panel">
            <header class="login-header">
                <h1>AI Course Assistant</h1>
                <p>Sign in to continue to your course assistant.</p>
            </header>

            <form id="loginForm" class="login-form">
                <div class="field-group">
                    <label for="usernameInput">Username</label>
                    <input
                        id="usernameInput"
                        type="text"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="passwordInput">Password</label>
                    <input
                        id="passwordInput"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginError" class="login-error" role="alert"></p>

                <button id="loginButton" type="submit">Login</button>
            </form>
        </section>
    </main>

    <main id="chatView" class="chat-shell hidden" aria-label="AI Course Assistant chat">
        <header class="chat-header">
            <div>
                <h1>AI Course Assistant</h1>
                <p>Ask questions about courses, modules, enrollment, and learning paths.</p>
            </div>
            <button id="logoutButton" class="logout-button" type="button">Logout</button>
        </header>

        <section id="messageArea" class="message-area" aria-live="polite">
            <div class="message assistant-message">
                <p>Hello. How can I help you with your courses today?</p>
            </div>
        </section>

        <form id="chatForm" class="chat-form">
            <label class="sr-only" for="messageInput">Message</label>
            <input
                id="messageInput"
                type="text"
                placeholder="Type your question..."
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>
    </main>

    <script src="app.js?v=14"></script>
</body>
</html>
