spring.config.import=optional:file:.env[.properties],optional:file:enrollment-service/.env[.properties]

spring.application.name=enrollment-service
server.port=8082

spring.data.mongodb.uri=mongodb://localhost:27018/enrollment_db

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest